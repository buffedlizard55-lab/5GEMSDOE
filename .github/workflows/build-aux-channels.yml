name: build-aux-channels
# =============================================================================
# Session 4 (2026-09-25): build the two channels the 19 official bands do not carry, on a runner,
# and bring them back THROUGH GIT so the egress-restricted development sandbox can train on them.
#
#   topo         10 m USGS 3DEP 1/3" DEM -> 9 scarp statistics per 100 m cell (H1)
#                (scripts/build_topo_features.py; the previous run took 874 s for 100 % coverage,
#                 but its 194 MB artifact was unreachable from the sandbox for two sessions)
#   radiometric  GeoDAWN K / eTh / eU / total count / ratios from ScienceBase (H2), plus a
#                measurement of what official band 6 (`tc`) actually is
#                (scripts/build_radiometric_channel.py)
#
# Each job quantises its raster to uint8 (scripts/aux_bridge.py pack), splits it into <= 45 MiB
# sha256-pinned parts and commits them to data/aux_bridge/<name>/ on the SAME branch.  The sandbox
# then runs `python scripts/aux_bridge.py unpack --name <name>`.
#
# Trigger: change any line of .github/triggers/aux-channels and push an arena/** branch
# (`gh workflow run` is refused with 403 from the sandbox, measured).  Deliberately NOT on main,
# so merging the PR does not rebuild and re-commit ~60 MB.
# Uses no credentials beyond the repository token; uploads nothing anywhere else.
# =============================================================================
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: [".github/triggers/aux-channels"]

permissions:
  contents: write

concurrency:
  group: build-aux-channels-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.vrt"
  GDAL_HTTP_MAX_RETRY: "5"
  GDAL_HTTP_RETRY_DELAY: "3"
  VSI_CACHE: "TRUE"
  VSI_CACHE_SIZE: "268435456"
  DEM_VRT: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/USGS_Seamless_DEM_13.vrt"

jobs:
  topo:
    name: 3DEP 10 m -> 100 m scarp channel -> git bridge
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: python -m pip install --quiet numpy scipy rasterio pytest
      - name: place the official rasters (sha256-pinned git bridge)
        run: |
          set -euo pipefail
          python scripts/assemble_data_bridge.py
          python scripts/prepare_data.py
      - name: unit tests (channel + bridge)
        run: python -m pytest tests/test_topo_features.py tests/test_aux_bridge.py -q
      - name: build the scarp channel over the whole footprint
        run: |
          set -euo pipefail
          mkdir -p data/external data/evidence/topo
          python scripts/build_topo_features.py --dem "$DEM_VRT" --fine-res 10 --chunk 256 \
            --out data/external/topo_features_100m.tif 2>&1 | tee data/evidence/topo/build_topo_features.aux.log
          cp data/external/topo_features_100m.report.json data/evidence/topo/topo_features_100m.report.json
      - name: pack into the git bridge
        run: |
          set -euo pipefail
          echo '{"workflow": "build-aux-channels", "job": "topo", "run_id": "${{ github.run_id }}", "dem": "'"$DEM_VRT"'"}' > /tmp/prov.json
          python scripts/aux_bridge.py pack --src data/external/topo_features_100m.tif --name topo --provenance /tmp/prov.json
          python scripts/aux_bridge.py verify --name topo
          du -sh data/aux_bridge/topo
      - name: commit the bridge to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/aux_bridge/topo data/evidence/topo
          git commit -m "aux-bridge(topo): 3DEP scarp channel, run ${{ github.run_id }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 15))
          done
          exit 1

  radiometric:
    name: GeoDAWN radiometrics -> competition grid -> git bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: python -m pip install --quiet numpy scipy rasterio pytest
      - name: place the official rasters (sha256-pinned git bridge)
        run: |
          set -euo pipefail
          python scripts/assemble_data_bridge.py
          python scripts/prepare_data.py
      - name: download the two GeoDAWN tiff zips from ScienceBase (MD5-checked by the builder)
        run: |
          set -euo pipefail
          mkdir -p /tmp/geodawn
          curl -fL --retry 5 --retry-delay 10 -o /tmp/geodawn/22103_area1_tiffs.zip \
            "https://www.sciencebase.gov/catalog/file/get/657e1d85d34e23d3533209f7?f=__disk__51%2Fa9%2F11%2F51a9112b3035464a94e3b1d1e6e6efd1e2ff80ae"
          curl -fL --retry 5 --retry-delay 10 -o /tmp/geodawn/22103_area2_tiffs.zip \
            "https://www.sciencebase.gov/catalog/file/get/657e1d85d34e23d3533209f7?f=__disk__35%2F69%2F6a%2F35696a36c88459bb8d2bd1a628c3306bc9749c2f"
          ls -la /tmp/geodawn
      - name: build the radiometric channel (+ band-6 identity test)
        run: |
          set -euo pipefail
          python scripts/build_radiometric_channel.py --zip-dir /tmp/geodawn 2>&1 | tee /tmp/rad.log
          mkdir -p data/evidence/radiometric
          cp /tmp/rad.log data/evidence/radiometric/build_radiometric_channel.log
      - name: pack into the git bridge
        run: |
          set -euo pipefail
          echo '{"workflow": "build-aux-channels", "job": "radiometric", "run_id": "${{ github.run_id }}", "source": "https://doi.org/10.5066/P93LGLVQ"}' > /tmp/prov.json
          python scripts/aux_bridge.py pack --src data/external/radiometric_100m.tif --name radiometric --provenance /tmp/prov.json
          python scripts/aux_bridge.py verify --name radiometric
          du -sh data/aux_bridge/radiometric
      - name: commit the bridge to this branch
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/evidence/radiometric || true
          [ -d data/aux_bridge/radiometric ] && git add -f data/aux_bridge/radiometric
          git commit -m "aux-bridge(radiometric): GeoDAWN K/eTh/eU channel, run ${{ github.run_id }} [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 15))
          done
          exit 1
